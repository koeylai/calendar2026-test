<script type="text/javascript">
	// Apply saved font size from cookie
	document.addEventListener('DOMContentLoaded', function() {
		var savedSize = get_cookie('page_size');
		if (savedSize) {
			document.body.style.fontSize = savedSize + 'px';
		}
	});
</script>
</head>

				</a>
			</nav>

		<!-- Font Resize Controls (3A Accessibility) -->
		<div class="button_resize" role="group" aria-label="字體大小調整">
			<a class="button_resize_100" href="javascript:void(0);"
				onclick="document.body.style.fontSize='12px'; set_cookie('page_size', '12', 30);"
				onkeydown="if(event.key==='Enter') this.click();"
				aria-label="預設字體大小" title="預設字體大小">A</a>&#160;&#160;<a class="button_resize_150" href="javascript:void(0);"
				onclick="document.body.style.fontSize='16px'; set_cookie('page_size', '16', 30);"
				onkeydown="if(event.key==='Enter') this.click();"
				aria-label="較大的字體" title="較大的字體">A</a>&#160;&#160;<a class="button_resize_200" href="javascript:void(0);"
				onclick="document.body.style.fontSize='20px'; set_cookie('page_size', '20', 30);"
				onkeydown="if(event.key==='Enter') this.click();"
				aria-label="最大的字體" title="最大的字體">A</a>
